<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloClo live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <div id="stage">
    <div class="hud">
      <span class="pill"><span class="dot"></span><span id="clock">Day 1 · 07:30</span><span id="viewers" class="watching" hidden></span></span>
      <div class="btns"><button id="speed" type="button">Speed 1×</button><button id="cam" type="button">Overview</button></div>
    </div>
    <div class="bubble" id="bubble">Good morning!</div>
    <div class="hint" id="hint">Drag to look around, scroll or pinch to zoom</div>
  </div>
  <aside>
    <div><h1>CloClo</h1><p class="sub">lives his own little life in Mosdorp</p></div>
    <div class="now"><b id="nowTxt">is waking up</b><span id="nowLoc">CloClo’s house</span><span id="nowMood" class="feeling"></span><span id="nowPlan" class="plan" hidden></span></div>
    <div><h2>Diary</h2><ol id="diary"></ol></div>
    <p class="note" id="brainNote">CloClo lives his own life in Mosdorp.</p>
  </aside>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
